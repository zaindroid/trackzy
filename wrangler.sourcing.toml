name = "sourcing-portal"
main = "apps/sourcing-worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static dashboard build output, served by this same Worker (Workers Assets).
# Run `pnpm --filter @sourcing/dashboard run build` first so the dist exists.
[assets]
directory = "apps/sourcing-dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "SOURCING_DB"
database_name = "sourcing-db"
database_id = "PLACEHOLDER__CREATE_WITH_wrangler_d1_create_sourcing_db"
migrations_dir = "packages/sourcing-db/migrations"

[vars]
MOCK_MODE = "false"
ENVIRONMENT = "production"
