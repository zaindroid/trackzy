name = "sourcing-portal"
main = "apps/sourcing-worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static dashboard build output, served by this same Worker (Workers Assets).
# Run `pnpm --filter @sourcing/dashboard run build` first so the dist exists.
[assets]
directory = "apps/sourcing-dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "SOURCING_DB"
database_name = "sourcing-db"
database_id = "01b523b9-c41d-45d0-9f0e-13f0a2e2c6d9"
migrations_dir = "packages/sourcing-db/migrations"

[vars]
MOCK_MODE = "false"
ENVIRONMENT = "production"

# NOTE: no [triggers] cron here — the Cloudflare account is already at the
# free-plan limit of 5 cron triggers total (all used by trackzy's worker, see
# wrangler.toml). The price/stock monitor sweep is instead triggered via a
# token-guarded internal endpoint (POST /internal/monitor-sweep), piggybacked
# on one of trackzy's existing cron ticks — see apps/worker/src/scheduled.ts
# and apps/sourcing-worker/src/routes/internal.ts. monitorDue() self-paces (it
# only processes listings actually due), so being pinged every ~10 min is fine.
