name: Radar crawl

on:
  schedule:
    # Weekly (Mondays 04:00 UTC) — credit-safe default on a free Apify account,
    # since each run explores fresh LLM niches (uncapped sold-data calls).
    # Increase the frequency once sold-data caching lands or you top up Apify.
    - cron: '0 4 * * 1'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run crawl
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_API_BASE: ${{ vars.EBAY_API_BASE }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          RADAR_INGEST_URL: ${{ secrets.RADAR_INGEST_URL }}
          RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
          # LLM niche generation (Groq) — the crawler picks its own niches.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MAX_NICHES: ${{ vars.MAX_NICHES }}
          SEED_THEMES: ${{ vars.SEED_THEMES }}
          # Real eBay demand signal (free, no Apify).
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          # Legacy supplier/sold sourcing.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_ACCESS_TOKEN: ${{ secrets.ALIEXPRESS_ACCESS_TOKEN }}
          ALIEXPRESS_REFRESH_TOKEN: ${{ secrets.ALIEXPRESS_REFRESH_TOKEN }}
          # Fallback seed list when no GROQ_API_KEY is set.
          SEEDS: ${{ vars.SEEDS }}
