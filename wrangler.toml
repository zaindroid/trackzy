name = "fulfillment-tracker"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static dashboard build output, served by the same Worker (Workers Assets).
# TODO(HUMAN): run `pnpm build` first so apps/dashboard/dist exists before `wrangler deploy`.
[assets]
directory = "apps/dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fulfillment-tracker-db"
database_id = "45d60393-e290-4550-8c87-166afc386de2"
migrations_dir = "packages/db/migrations"

# Queue: webhook fan-out only. Real work happens in Workflows, not here.
[[queues.producers]]
queue = "order-events"
binding = "ORDER_QUEUE"

[[queues.consumers]]
queue = "order-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "order-events-dlq"

[[queues.producers]]
queue = "order-events-dlq"
binding = "ORDER_QUEUE_DLQ"

# Durable orchestration for the order lifecycle and dispute drafting.
[[workflows]]
binding = "ORDER_WORKFLOW"
name = "order-workflow"
class_name = "OrderWorkflow"

[[workflows]]
binding = "DISPUTE_WORKFLOW"
name = "dispute-workflow"
class_name = "DisputeWorkflow"

# Non-secret runtime config. Secrets (tokens/keys) go through `.dev.vars` locally
# and `wrangler secret put` in production — never committed here.
# MOCK_MODE=false: Shopify + Gemini secrets are real (set via `wrangler secret
# put`); 17TRACK/Clerk/supplier secrets are still unset, so those specific
# adapters keep mocking via their own per-key placeholder detection.
[vars]
MOCK_MODE = "false"
ENVIRONMENT = "production"

# Inbound supplier tracking emails arrive via Cloudflare Email Routing, which is
# configured in the dashboard (see DEPLOY.md) and dispatches to this Worker's
# `email()` export in apps/worker/src/email.ts — no wrangler.toml binding needed
# for inbound; `send_email` below is for outbound (dispute email sending, mocked).
[[send_email]]
name = "DISPUTE_EMAIL"

# Gmail inbox polling (spec 6b, every 5 min) + hourly repricing/stock-sync
# sweep (spec section 10). Keep in sync with apps/worker/src/scheduled.ts's
# GMAIL_POLL_CRON / REPRICING_SWEEP_CRON constants.
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]
